<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="深夜ラジオ局の電波から生まれた13人のキャラをステージに並べて曲を作る、スマホ横画面向けの音楽ゲーム。">
<meta name="theme-color" content="#e9f1fb">
<title>ノッポンズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=%E2%80%A6%E3%81%84%E3%81%8C%E3%81%A3%E3%81%B1%E3%82%A6%E3%82%B3%E3%82%B6%E3%82%B7%E3%82%B8%E3%82%B9%E3%82%BA%E3%82%BD%E3%83%83%E3%83%86%E3%83%89%E3%83%8E%E3%83%90%E3%83%95%E3%83%98%E3%83%9B%E3%83%9C%E3%83%9D%E3%83%AB%E3%83%B3%E3%83%BC%E5%9B%B3%E9%91%91%EF%BC%81">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* base reset (the artifact viewer supplied this; needed when served standalone) */
html{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one screen, landscape-first — top bar, a drawn stage scene (daytime public recording outside the radio station; after the broadcast accident it becomes the same place at night), 7 spots, sound tray below. Deliberately two fixed worlds: bright by default, horror when transformed. */
:root{
  color-scheme: light;
  --night:#e9f1fb;
  --night-2:#ffffff;
  --line:#c3cfe2;
  --empty:rgba(255,255,255,.4);
  --edge:#1b1720;
  --ink:#1b1720;
  --ink-dim:#56607a;
  --tag-ink:#ffffff;
  --hint-bg:rgba(255,255,255,.82);
  --rhythm:#e8475a;
  --bass:#d59100;
  --melody:#2fa14c;
  --voice:#2d7fd6;
  --curse:#6f8fb0;
  --accent:#ffcf3a;
  --accent-ink:#1b1720;
  --f-display:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --slot:clamp(44px,min(11vw,calc((100vh - 230px) / 1.56)),150px);
  --chip:clamp(34px,min(5.5vw,14vh),64px);
}
body.horror{
  color-scheme: dark;
  --night:#0d0709;
  --night-2:#1a0e12;
  --line:#3e1e27;
  --empty:rgba(20,8,12,.6);
  --edge:#000000;
  --ink:#f2e2da;
  --ink-dim:#a88a8f;
  --tag-ink:#0d0709;
  --hint-bg:transparent;
  --rhythm:#c64352;
  --bass:#b98a33;
  --melody:#6a9a62;
  --voice:#4f87ad;
  --curse:#cfeaff;
  --accent:#ff3b4e;
  --accent-ink:#0d0709;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .5s}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.app{
  height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;gap:6px;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 8px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
/* top bar */
.top{display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);min-height:32px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(17px,2.6vw,26px);margin:0;white-space:nowrap;letter-spacing:.02em;line-height:1}
.brand .c1{color:var(--rhythm)}.brand .c2{color:var(--bass)}.brand .c3{color:var(--melody)}.brand .c4{color:var(--voice)}
.horror .brand{animation:shiver 3s infinite}
@keyframes shiver{0%,92%,100%{transform:none}93%{transform:translate(1px,-1px) skewX(-6deg)}95%{transform:translate(-2px,1px)}97%{transform:skewX(4deg)}}
.meter{display:flex;align-items:center;gap:4px;margin-left:auto}
.bar{width:clamp(16px,3vw,34px);height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left center;transform:scaleX(0)}
.meter.run .bar i{animation:bf0 8s linear infinite}
.meter.run .bar:nth-child(2) i{animation-name:bf1}.meter.run .bar:nth-child(3) i{animation-name:bf2}.meter.run .bar:nth-child(4) i{animation-name:bf3}
@keyframes bf0{0%{transform:scaleX(0)}25%,100%{transform:scaleX(1)}}
@keyframes bf1{0%,25%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
@keyframes bf2{0%,50%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}
@keyframes bf3{0%,75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.meta{font-size:11px;font-weight:700;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.04em}
.btns{display:flex;gap:6px}
.btn{font:800 12px/1 var(--f-body);color:var(--ink);background:var(--night-2);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.morph{background:var(--accent);border-color:var(--edge);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,.fig:focus-visible,.rm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* stage */
.stage{position:relative;min-height:0;border-radius:20px;overflow:hidden;
  background:#8fd3ff;box-shadow:0 0 0 2.5px var(--edge)}
.horror .stage{background:#0b0507}
.stage{container-type:size}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene>div{position:absolute;inset:0}
/* the picture box is always 3:1 and anchored bottom-centre, like "xMidYMax slice" */
.sbox{position:absolute;left:50%;bottom:0;width:100%;width:max(100%,300cqh);aspect-ratio:3/1;transform:translateX(-50%)}
.sbox .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* animated pieces are small HTML boxes so the GPU can move/fade them without repainting the picture */
.fx{position:absolute;display:block}
.fx svg{display:block;width:100%;height:100%;overflow:visible}
.scene .day{transition:opacity .5s}
.scene .night,.horror .scene .day{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.horror .scene .night{opacity:1;visibility:visible;transition:opacity .5s}
.horror .day .fx,body:not(.horror) .night .fx{animation-play-state:paused}
.cloud{animation:drift 38s ease-in-out infinite alternate}.cloud.c2{animation-duration:52s;animation-direction:alternate-reverse}.cloud.c3{animation-duration:44s}
@keyframes drift{to{transform:translateX(70px)}}
.blink{animation:blink 1.6s steps(1) infinite}.blink.slow{animation-duration:3.2s}
@keyframes blink{50%{opacity:.12}}
.wave{opacity:0;animation:wave 2.4s ease-out infinite}.wave.w2{animation-delay:.5s}.wave.w3{animation-delay:1s}
@keyframes wave{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
.peep{animation:peep 5s infinite}.peep.p2{animation-delay:1.3s}.peep.p3{animation-delay:2.9s;animation-duration:6.5s}.peep.p4{animation-delay:.6s;animation-duration:4.2s}
@keyframes peep{0%,40%,47%,100%{transform:scaleY(1)}43%{transform:scaleY(.1)}}
.flicker{animation:flick 2.3s infinite}.flicker.f2{animation-duration:3.7s}
.stage::before{content:"";position:absolute;inset:-6px 0 0;z-index:3;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);transition:opacity .5s}
.horror .stage::before{opacity:1;animation:scan .24s steps(3) infinite}
@keyframes scan{to{transform:translateY(6px)}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(closest-side,transparent 55%,rgba(0,0,0,.65));opacity:0;transition:opacity .6s;z-index:4}
.horror .stage::after{opacity:1}
.lights{position:absolute;left:4%;right:4%;top:4px;height:26px;pointer-events:none}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.lights path{fill:none;stroke:var(--edge);stroke-width:1.5;vector-effect:non-scaling-stroke}
.bulb{position:absolute;width:9px;height:12px;margin-left:-4.5px;border-radius:50% 50% 45% 45%;background:color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 0 0 1.5px var(--edge);transition:background .3s}
.combo .bulb{background:var(--c);box-shadow:0 0 0 1.5px var(--edge),0 0 9px var(--c);animation:beat .5s ease-out infinite}
@keyframes beat{0%{opacity:1}100%{opacity:.5}}
.horror .bulb{background:#2a0c12;box-shadow:none;opacity:1}
.horror .bulb:nth-child(5n+2){background:#ff2a3a;box-shadow:0 0 10px #ff2a3a;animation:flick 2.7s infinite}
.horror .combo .bulb:nth-child(odd){background:#ff2a3a;box-shadow:0 0 10px #ff2a3a;animation:beat .5s ease-out infinite}
.stage.flash{filter:brightness(1.8) contrast(1.3)}
.hint{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;top:34px;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;font-weight:800;font-size:clamp(12px,1.7vw,15px);color:var(--ink);background:var(--hint-bg);padding:4px 14px;border-radius:999px;z-index:1}
.live .hint{display:none}
.slots{position:absolute;left:0;right:0;top:34px;bottom:10%;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.1vw,14px);z-index:2}
.slot{position:relative;width:var(--slot);display:flex;flex-direction:column;align-items:center}
.slot::before{content:"";position:absolute;bottom:-3px;left:16%;right:16%;height:9px;border-radius:50%;background:rgba(0,0,0,.3)}
.slot.hover::after{content:"";position:absolute;inset:-6% -6% -4%;border-radius:40%;background:radial-gradient(closest-side,rgba(255,207,92,.28),transparent);pointer-events:none}
.fig{all:unset;display:block;width:100%;transform-origin:50% 100%;cursor:pointer;position:relative}
.slot.on .fig{animation:bob .5s ease-out infinite}
@keyframes bob{0%{transform:scale(1.04,.96)}35%{transform:scale(1.008,.992)}100%{transform:none}}
.muted .fig,.pending .fig{animation:none}
.sq{display:block;transform-origin:50% 100%;transition:transform .14s ease-out;will-change:transform}
.singing .sq{transform:scale(.95,1.07)}
.fig svg{transform-origin:50% 100%}
.horror .slot.on .sq{animation:figflick 3.1s infinite}
.horror .slot:nth-child(2n) .sq{animation-duration:4.3s}.horror .slot:nth-child(3n) .sq{animation-duration:3.7s;animation-delay:-1.2s}
@keyframes figflick{0%,46%,51%,72%,100%{opacity:1}47%{opacity:.35}49%{opacity:.9}50%{opacity:.45}73%{opacity:.7}}
.horror .singing .sq{animation:jit .24s steps(1) infinite}
@keyframes jit{0%{transform:translate(1px,0) rotate(2deg) scale(.95,1.07)}25%{transform:translate(-1.5px,0) rotate(-3deg) scale(.95,1.07)}50%{transform:translate(.5px,0) rotate(1deg) scale(.95,1.07)}75%{transform:translate(-1px,0) rotate(-2.5deg) scale(.95,1.07)}}
.slot.empty .fig{cursor:default}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.ghostbody{fill:var(--empty);stroke:var(--line);stroke-width:2.5;stroke-dasharray:6 6}
.slot.hover .ghostbody{stroke:var(--accent)}
.zz{fill:var(--ink-dim);font:800 14px var(--f-body);opacity:.6}
.zz.sm{font-size:10px}
.mo,.sleep{visibility:hidden}
.singing .mo{visibility:visible}.singing .mc{visibility:hidden}
.muted .eyes{visibility:hidden}.muted .sleep{visibility:visible}
.muted .fig{filter:grayscale(.85) brightness(.6)}
.pending .fig svg{opacity:.6;animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes flick{0%,46%,51%,72%,100%{opacity:1}47%{opacity:.15}49%{opacity:.9}50%{opacity:.2}73%{opacity:.5}}
.tag{position:absolute;top:calc(100% + 4px);font:800 10px/1.5 var(--f-body);padding:0 7px;border-radius:999px;background:var(--c,transparent);color:var(--tag-ink);box-shadow:0 0 0 1.5px var(--edge);white-space:nowrap}
.slot.empty .tag{display:none}
.muted .tag{background:var(--line);color:var(--ink-dim)}
.rm{position:absolute;top:9%;right:-2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--night);color:var(--ink);font:800 13px/22px var(--f-body);padding:0;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;display:none;z-index:2}
.rm::after{content:"";position:absolute;inset:-9px}
.slot.on .rm{display:block}
.toast{position:absolute;left:50%;top:28%;transform:translate(-50%,0);font-family:var(--f-display);font-size:clamp(24px,5vw,48px);color:var(--accent);text-shadow:0 3px 0 var(--edge),0 0 18px var(--accent);-webkit-text-stroke:1.5px var(--edge);white-space:nowrap;pointer-events:none;opacity:0;z-index:6}
.toast.small{font-size:clamp(16px,3vw,24px);color:#fff;text-shadow:0 2px 0 var(--edge);-webkit-text-stroke:1px var(--edge)}
.toast.show{animation:pop 1.7s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.app.glitch .stage{animation:glitch .75s steps(2) both}
.app.glitch .tray{animation:glitch .75s steps(3) both}
@keyframes glitch{0%{filter:invert(1) hue-rotate(160deg);transform:translate(4px,-2px)}20%{filter:none;transform:translate(-6px,2px) skewX(8deg)}40%{filter:contrast(2) saturate(3) hue-rotate(-40deg);transform:translate(3px,0)}60%{filter:invert(1);transform:translate(0,3px) skewX(-6deg)}80%{filter:brightness(.3);transform:none}100%{filter:none;transform:none}}

/* tray */
.tray{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;gap:clamp(6px,1.6vw,22px);padding:5px 12px 6px;background:var(--night-2);border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.grp{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp h2{margin:0 0 0 2px;font:800 10px/1.4 var(--f-body);letter-spacing:.14em;color:var(--c)}
.chips{display:flex;gap:clamp(4px,.8vw,8px)}
.chip{all:unset;box-sizing:border-box;width:var(--chip);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;touch-action:none;color:var(--ink)}
.disc{width:var(--chip);height:var(--chip);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--night));box-shadow:inset 0 0 0 2px var(--c);overflow:hidden}
.disc svg{width:96%;height:auto;margin-top:12%}
.chip span{font:800 10px/1.3 var(--f-body);white-space:nowrap}
.chip.used{opacity:.28;cursor:default}
.chip.cursed{position:relative}
.chip.cursed .disc{background:#140a0a;box-shadow:inset 0 0 0 2px var(--curse)}
.chip.cursed::before{content:"";position:absolute;left:0;top:0;width:var(--chip);height:var(--chip);border-radius:50%;box-shadow:0 0 12px 3px var(--curse);opacity:0;pointer-events:none;animation:ember 2.4s ease-in-out infinite}
.chip.cursed.used::before{display:none}
@keyframes ember{50%{opacity:1}}
.chip.nope{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ghost{position:fixed;left:0;top:0;width:calc(var(--slot)*.9);pointer-events:none;z-index:50;will-change:transform;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.ghost svg{display:block;width:100%;height:auto;overflow:visible}

/* character book */
.book{position:fixed;inset:0;z-index:80;background:var(--night);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) 24px}
.book-head{display:flex;align-items:flex-start;gap:16px;max-width:1100px;margin:0 auto 12px}
.book-head h2{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);margin:0 0 4px;font-weight:400}
.book-head p{margin:0;max-width:62ch;font-size:13px;line-height:1.75;color:var(--ink-dim)}
.book-head .btn{margin-left:auto;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;max-width:1100px;margin:0 auto}
.card{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--night-2);box-shadow:inset 0 0 0 1.5px var(--line);min-width:0}
.pics{display:flex;gap:4px;flex:none}
.pics figure{margin:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pics svg{width:100%;height:auto;display:block;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,var(--night))}
.pics .dark svg{background:#140a0e}
.pics figcaption{font-size:9px;font-weight:800;color:var(--ink-dim);letter-spacing:.06em}
.txt{min-width:0}
.txt .cat{margin:0;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--c)}
.txt h3{margin:0 0 4px;font-size:16px;font-weight:800}
.txt h3 span{font-size:12px;color:#e0566a;font-weight:800;margin-left:4px}
.txt p{margin:0 0 6px;font-size:12.5px;line-height:1.7}
.txt p.h{color:#e7a3ab;padding-left:8px;box-shadow:inset 2px 0 0 #8c2333}

/* portrait */
.rotate{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:var(--night)}
.rotate p{margin:0;font-weight:800;font-size:17px}
.rotate small{color:var(--ink-dim);font-size:13px;font-weight:700}
.phone{width:40px;height:68px;border:3px solid var(--ink);border-radius:9px;position:relative;animation:turn 2s ease-in-out infinite}
.phone::after{content:"";position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:var(--ink)}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (max-width:720px){.meta{display:none}}
@media (orientation:portrait) and (max-width:820px){
  body:not(.force) .rotate{display:flex}
  :root{--slot:min(12.4vw,80px);--chip:min(12.5vw,56px)}
  .tray{grid-template-columns:repeat(3,auto)}
}
@media (prefers-reduced-motion:reduce){
  .pending .fig svg,.chip.cursed::before,.cloud,.blink,.peep,.flicker,.horror .stage::before,.phone,.horror .brand,.horror .bulb,.combo .bulb,.slot.on .fig,.horror .slot.on .sq,.horror .singing .sq,.meter.run .bar i,.app.glitch .stage,.app.glitch .tray{animation:none}
  .toast.show{animation:none;opacity:1}
  .wave{animation:none;opacity:.8}
}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
  <radialGradient id="hs2" cx=".45" cy=".35" r=".78"><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs></svg>

<div class="app" id="app">
  <header class="top">
    <h1 class="brand"><span class="c1">ノ</span><span class="c2">ッ</span><span class="c3">ポ</span><span class="c4">ン</span>ズ</h1>
    <div class="meter" id="meter" aria-label="ループの位置">
      <div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div>
      <span class="meta">4小節 · 120 BPM</span>
    </div>
    <div class="btns">
      <button class="btn" id="bookBtn" type="button">図鑑</button>
      <button class="btn morph" id="morph" type="button" aria-pressed="false">変身</button>
      <button class="btn" id="fs" type="button" aria-pressed="false">全画面</button>
      <button class="btn" id="rand" type="button">おまかせ</button>
      <button class="btn" id="reset" type="button">リセット</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="scene" aria-hidden="true">
      <div class="day"><div class="sbox"><svg class="bg" viewBox="0 0 1200 400">
        <defs><linearGradient id="dSky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6cc6fb"/><stop offset="1" stop-color="#d6f2ff"/></linearGradient></defs>
        <rect width="1200" height="400" fill="url(#dSky)"/>
        <circle cx="1068" cy="78" r="70" fill="#fff6b8" opacity=".45"/>
        <circle cx="1068" cy="78" r="44" fill="#ffe36a" stroke="#1b1720" stroke-width="3"/>

/* ---------- audio: file playback ---------- */
let ctx=null,master;
const raw=new Map(),dec=new Map();
function fetchRaw(name){
  if(!raw.has(name)){
    const p=fetch(AUD+name+'.mp3').then(r=>{if(!r.ok) throw new Error(r.status);return r.arrayBuffer();});
    p.catch(()=>raw.delete(name));raw.set(name,p);
  }
  return raw.get(name);
}
function getBuf(name){
  if(!dec.has(name)){
    const p=fetchRaw(name).then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab.slice(0),res,rej)));
    p.catch(()=>dec.delete(name));dec.set(name,p);
  }
  return dec.get(name);
}
function pruneCache(){
  if(dec.size<=14) return;
  const keep=new Set(['drone_h','sting_on','sting_off']);
  for(const S of slots) if(S) keep.add(S.sound.id+'_'+S.ver);
  for(const k of [...dec.keys()]) if(!keep.has(k)) dec.delete(k);
}
let warmed=false;
function ensureAudio(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=.7;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
    master.connect(comp);comp.connect(ctx.destination);
    const sb=ctx.createBufferSource();sb.buffer=ctx.createBuffer(1,1,22050);sb.connect(ctx.destination);sb.start(0);
  }
  if(ctx.state==='suspended'&&!document.hidden) ctx.resume();
  if(!warmed){warmed=true;
    setTimeout(()=>{['sting_on','sting_off','drone_h'].forEach(getBuf);},800);}
}
const phaseAt=t=>((t-t0)%L+L)%L;
function startSrc(buf,dest,when,fadeIn){
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.loopStart=M;src.loopEnd=M+L;
  const xg=ctx.createGain();src.connect(xg);xg.connect(dest);
  if(fadeIn){xg.gain.setValueAtTime(0,when);xg.gain.linearRampToValueAtTime(1,when+fadeIn);}
  src.start(when,M+phaseAt(when));
  return {src,xg};
}
function stopSrc(v,at,fade){
  if(!v) return;
  v.xg.gain.cancelScheduledValues(at);v.xg.gain.setValueAtTime(v.xg.gain.value,at);v.xg.gain.linearRampToValueAtTime(0,at+fade);
  try{v.src.stop(at+fade+.02);}catch(_){}
  setTimeout(()=>{v.xg.disconnect();},(at+fade-ctx.currentTime)*1000+200);
}
function playOnce(name){getBuf(name).then(b=>{const s=ctx.createBufferSource();s.buffer=b;s.connect(master);s.start();}).catch(()=>{});}

/* clock: t0 is the downbeat of loop 0; every voice derives its offset from it */
let running=false,t0=0,drone=null;
function startClock(){running=true;t0=ctx.currentTime+.06;meterEl.classList.add('run');startPoll();align(meterEl);if(horror) setDrone(true);}
function stopClock(){running=false;setDrone(false);meterEl.classList.remove('run');}
const nextBar=t=>t0+Math.ceil((t-t0)/BAR)*BAR;
async function setDrone(on){
  if(!ctx) return;
  if(!on){if(drone){stopSrc(drone,ctx.currentTime,.6);drone=null;}return;}
  if(drone||!running) return;
  drone='loading';
  const b=await getBuf('drone_h').catch(()=>null);
  if(drone!=='loading'||!b||!horror||!running){if(drone==='loading') drone=null;return;}
  drone=startSrc(b,master,ctx.currentTime+.03,1);
}
async function startSlot(i,S){
  let ver,buf;
  do{ver=horror?'h':'n';buf=await getBuf(S.sound.id+'_'+ver).catch(()=>null);}while(buf&&ver!==(horror?'h':'n'));
  if(slots[i]!==S) return;
  if(!buf){toast('音声を読み込めませんでした',true);removeSlot(i);return;}
  if(!running) startClock();
  const now=ctx.currentTime,when=t0>=now?t0:nextBar(now+.03);
  S.ver=ver;S.startAt=when;S.v=startSrc(buf,S.bus,when,0);
}
async function switchVersion(S){
  const ver=horror?'h':'n';if(!S.v||S.ver===ver) return;
  const tok=++S.tok,buf=await getBuf(S.sound.id+'_'+ver).catch(()=>null);
  if(!buf||tok!==S.tok||!slots.includes(S)||S.ver===ver) return;
  const when=Math.max(ctx.currentTime+.03,S.startAt);
  stopSrc(S.v,when,.25);S.v=startSrc(buf,S.bus,when,.25);S.ver=ver;pruneCache();
}

function renderChips(){for(const s of SOUNDS){const b=chipEls[s.id];
  b.setAttribute('aria-label',`${CATS[s.cat]}：${nm(s)}`);b.innerHTML=`<span class="disc">${figSVG(s,horror,CHIPVB)}</span><span>${nm(s)}</span>`;}}
renderChips();
(window.requestIdleCallback||(f=>setTimeout(f,600)))(()=>SOUNDS.forEach(s=>fetchRaw(s.id+'_n')));

function renderSlot(i){
  const el=slotEls[i],S=slots[i],fig=el.querySelector('.fig'),tag=el.querySelector('.tag');
  el.classList.toggle('on',!!S);el.classList.toggle('empty',!S);
  el.classList.toggle('muted',!!S&&S.muted);el.classList.remove('singing','pending');
  if(S){S.cS=false;S.cP=null;}
  fig.innerHTML=S?`<span class="sq">${figSVG(S.sound)}</span>`:EMPTY;
  fig.setAttribute('aria-label',S?`${nm(S.sound)}（タップでミュート）`:'空き');
  tag.textContent=S?nm(S.sound):'';tag.style.setProperty('--c',S?`var(--${S.sound.cat})`:'transparent');
}
function updateChips(){const used=new Set(slots.filter(Boolean).map(S=>S.sound.id));
  for(const id in chipEls) chipEls[id].classList.toggle('used',used.has(id));
  stage.classList.toggle('live',used.size>0);}
let comboOn=false,fullOn=false;
function checkCombo(){
  const act=slots.filter(Boolean),c=new Set(act.map(S=>S.sound.cat).filter(x=>x!=='curse')).size===4,f=act.length===NSLOT;
  stage.classList.toggle('combo',c);if(c&&!comboOn) align(lightsEl);
  if(f&&!fullOn) toast(horror?'ホウソウジコ':'フルバンド！');else if(c&&!comboOn) toast(horror?'ザザッ…':'コンボ！');
  comboOn=c;fullOn=f;
}
function toast(txt,small){toastEl.textContent=txt;toastEl.className='toast'+(small?' small':'');void toastEl.offsetWidth;toastEl.classList.add('show');}
const curseOnStage=()=>slots.some(S=>S&&S.sound.cat==='curse');

function place(i,snd){
  ensureAudio();if(!ctx) return;
  const replacedCurse=!!slots[i]&&slots[i].sound.cat==='curse';
  if(slots[i]) clearSlot(i);
  const bus=ctx.createGain();bus.gain.value=snd.vol*FILEGAIN;bus.connect(master);
  const S={sound:snd,bus,v:null,ver:null,startAt:Infinity,muted:false,sing:0,tok:0};
  slots[i]=S;renderSlot(i);updateChips();checkCombo();startSlot(i,S);
  fetchRaw(snd.id+'_'+(horror?'n':'h'));   /* the other version, so transforming is instant */
  if(snd.cat==='curse') setHorror(true);
  else if(replacedCurse&&!curseOnStage()) setHorror(false);
}
function clearSlot(i){
  const S=slots[i];if(!S) return;
  S.tok++;if(S.v) stopSrc(S.v,ctx.currentTime,.12);
  setTimeout(()=>S.bus.disconnect(),600);
  slots[i]=null;renderSlot(i);pruneCache();
}
function removeSlot(i){const wasCurse=!!slots[i]&&slots[i].sound.cat==='curse';clearSlot(i);updateChips();checkCombo();if(!slots.some(Boolean)) stopClock();if(wasCurse&&!curseOnStage()) setHorror(false);}
function clearAll(){const hadCurse=curseOnStage();for(let i=0;i<NSLOT;i++) if(slots[i]) clearSlot(i);updateChips();checkCombo();if(running) stopClock();if(hadCurse) setHorror(false);}
function toggleMute(i){const S=slots[i];if(!S) return;S.muted=!S.muted;
  S.bus.gain.cancelScheduledValues(ctx.currentTime);S.bus.gain.setTargetAtTime(S.muted?0:S.sound.vol*FILEGAIN,ctx.currentTime,.03);
  slotEls[i].classList.toggle('muted',S.muted);if(!S.muted) align(slotEls[i]);}
const firstEmpty=()=>slots.findIndex(S=>!S);

/* 変身モード */
let morphing=false,wantHorror=false,flashT=null;
function flashLoop(){
  if(!horror||reduced){flashT=null;return;}
  if(!document.hidden){stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),70);}
  flashT=setTimeout(flashLoop,2000+Math.random()*6000);
}
function setHorror(on){
  wantHorror=on;
  if(morphing||on===horror) return;
  ensureAudio();morphing=true;
  if(ctx) playOnce(on?'sting_on':'sting_off');
  app.classList.add('glitch');
  setTimeout(()=>{
    horror=on;document.body.classList.toggle('horror',on);
    const btn=$('#morph');btn.textContent=on?'もどる':'変身';btn.setAttribute('aria-pressed',on);
    $('#hint').textContent=on?'ザ…ザザ…きこえますか…':'下のノッポンズをステージへドラッグ！　タップでも乗せられます';
    slots.forEach((S,i)=>{if(S) switchVersion(S);renderSlot(i);});
    setDrone(on);
    renderChips();comboOn=false;fullOn=false;checkCombo();
    if(on){toast('ヘンシン');if(!flashT) flashT=setTimeout(flashLoop,3000);}
  },360);
  setTimeout(()=>{app.classList.remove('glitch');morphing=false;if(wantHorror!==horror) setHorror(wantHorror);},760);
}
$('#morph').addEventListener('click',()=>{
  const goal=!(morphing?wantHorror:horror);
  if(!goal&&curseOnStage()){
    slots.forEach((S,i)=>{if(S&&S.sound.cat==='curse') clearSlot(i);});
    updateChips();checkCombo();if(!slots.some(Boolean)) stopClock();
  }
  setHorror(goal);
});

/* drag & tap */
let drag=null,suppressClick=false;
let geo=null;   /* stage + slot centres, measured once when a drag starts */
function measure(){const r=stage.getBoundingClientRect();geo={r,cx:slotEls.map(el=>{const b=el.getBoundingClientRect();return b.left+b.width/2;})};}
function slotAt(x,y){
  if(!geo) measure();const r=geo.r;
  if(x<r.left||x>r.right||y<r.top||y>r.bottom) return -1;
  let best=-1,bd=1e9;
  geo.cx.forEach((c,i)=>{const d=Math.abs(c-x);if(d<bd){bd=d;best=i;}});
  return best;
}
let hoverI=-1;
function setHover(i){if(i===hoverI) return;hoverI=i;slotEls.forEach((el,k)=>el.classList.toggle('hover',k===i));}
function bindChip(b,s){
  b.addEventListener('pointerdown',e=>{
    suppressClick=false;ensureAudio();
    if(b.classList.contains('used')) return;
    fetchRaw(s.id+'_'+(horror?'h':'n'));
    drag={s,b,id:e.pointerId,x0:e.clientX,y0:e.clientY,ghost:null};
    try{b.setPointerCapture(e.pointerId);}catch(_){}
  });
  b.addEventListener('pointermove',e=>{
    if(!drag||drag.b!==b||e.pointerId!==drag.id) return;
    if(!drag.ghost){
      if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8) return;
      drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.innerHTML=figSVG(s);document.body.appendChild(drag.ghost);measure();
    }
    drag.ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-60%) rotate(-6deg)`;
    setHover(slotAt(e.clientX,e.clientY));
  });
  const end=e=>{
    if(!drag||drag.b!==b) return;
    if(drag.ghost){
      suppressClick=true;
      const i=e.type==='pointerup'?slotAt(e.clientX,e.clientY):-1;
      drag.ghost.remove();setHover(-1);geo=null;
      if(i>=0) place(i,s);
    }
    drag=null;
  };
  b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  b.addEventListener('click',()=>{
    if(suppressClick){suppressClick=false;return;}
    if(b.classList.contains('used')) return;
    const i=firstEmpty();
    if(i<0){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');toast('ステージがいっぱい',true);return;}
    place(i,s);
  });
}
document.addEventListener('pointerdown',ensureAudio,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!ctx) return;if(document.hidden) ctx.suspend();else ctx.resume().then(()=>{align(stage);align(meterEl);});});

$('#reset').addEventListener('click',clearAll);
$('#rand').addEventListener('click',async()=>{
  ensureAudio();if(!ctx) return;clearAll();
  const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
  const pick=MAIN.map(c=>sh(SOUNDS.filter(s=>s.cat===c))[0]);
  const rest=sh(SOUNDS.filter(s=>s.cat!=='curse'&&!pick.includes(s))).slice(0,1+Math.floor(Math.random()*3));
  const chosen=sh([...pick,...rest]),spots=sh([...Array(NSLOT).keys()]);
  await Promise.all(chosen.map(s=>getBuf(s.id+'_'+(horror?'h':'n')).catch(()=>null)));
  chosen.forEach((s,k)=>place(spots[k],s));
});
$('#force').addEventListener('click',()=>document.body.classList.add('force'));

/* 全画面 */
const docEl=document.documentElement,fsBtn=$('#fs');
const reqFs=docEl.requestFullscreen||docEl.webkitRequestFullscreen,exitFs=document.exitFullscreen||document.webkitExitFullscreen;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
fsBtn.addEventListener('click',async()=>{
  try{
    if(isFs()){await exitFs.call(document);return;}
    if(!reqFs||document.fullscreenEnabled===false) throw 0;
    await reqFs.call(docEl,{navigationUI:'hide'});
  }catch(_){toast('この端末では全画面にできません。ブラウザの「ホーム画面に追加」で全画面になります',true);}
});
function onFsChange(){
  const on=isFs();fsBtn.textContent=on?'全画面を解除':'全画面';fsBtn.setAttribute('aria-pressed',on);
  try{if(on) screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});else screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(_){}
}
document.addEventListener('fullscreenchange',onFsChange);document.addEventListener('webkitfullscreenchange',onFsChange);

/* 図鑑 */
const book=$('#book');let bookBuilt=false;
function renderBook(){
  if(bookBuilt) return;bookBuilt=true;
  $('#cards').innerHTML=SOUNDS.map(s=>`<article class="card" style="--c:var(--${s.cat})">
    <div class="pics"><figure>${normalSVG(s)}<figcaption>ふだん</figcaption></figure><figure class="dark">${horrorSVG(s)}<figcaption>変身後</figcaption></figure></div>
    <div class="txt"><p class="cat">${CATS[s.cat]}</p><h3>${s.name}<span>→ ${s.hname}</span></h3><p>${s.story}</p><p class="h">${s.hstory}</p></div></article>`).join('');
}
$('#bookBtn').addEventListener('click',()=>{renderBook();book.hidden=false;book.scrollTop=0;$('#bookClose').focus();});
$('#bookClose').addEventListener('click',()=>{book.hidden=true;$('#bookBtn').focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!book.hidden) book.hidden=true;});

/* animation: the bounce, squash, jitter, meter and bulbs are CSS animations run by the GPU.
   The script only (1) locks their phase to the music clock and (2) flips mouth/pending classes when they change. */
const SYNC=new Set(['bob','beat','bf0','bf1','bf2','bf3']);
function align(root){
  if(!running||!ctx||!root.getAnimations) return;
  const T=document.timeline.currentTime-(ctx.currentTime-t0)*1000;
  for(const a of root.getAnimations({subtree:true})) if(SYNC.has(a.animationName)) a.startTime=T;
}
let poll=null;
function startPoll(){if(!poll) poll=setInterval(tick,33);}
function tick(){
  if(!running){clearInterval(poll);poll=null;return;}
  const now=ctx.currentTime,el=now-t0;if(el<0) return;
  const cell=Math.floor((el%L)/L*CELLS)%CELLS;
  for(let i=0;i<NSLOT;i++){
    const S=slots[i];if(!S) continue;
    const elS=slotEls[i],pend=now<S.startAt;
    if(pend!==S.cP){elS.classList.toggle('pending',pend);S.cP=pend;if(!pend) align(elS);}
    const sing=!pend&&!S.muted&&!!S.ver&&HITS[S.sound.id+'_'+S.ver][cell]===1;
    if(sing!==S.cS){elS.classList.toggle('singing',sing);S.cS=sing;}
  }
}
})();

</script>
